apiVersion: v1
kind: Service
metadata:
  name: student-management-service
  labels:
    app: student-management
    managed-by: devops-college-project
spec:
  # NodePort allows accessing the application from outside the Kubernetes cluster
  type: NodePort
  selector:
    app: student-management
  ports:
    - name: http
      protocol: TCP
      port: 3000        # Service cluster port
      targetPort: 3000  # Target port inside the Pod container
      nodePort: 30080   # Port exposed on the host machine (http://localhost:30080)
